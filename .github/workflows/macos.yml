name: macOS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Run unit tests
        run: cargo test --release --verbose

      - name: Smoke test — free port
        run: |
          ./target/release/portmortem 65432
          ./target/release/portmortem 65432 --json

      - name: Smoke test — occupied port (real lsof path)
        run: |
          # -u: unbuffered stdout, so redirected output shows up immediately
          # instead of sitting in a block buffer (stdout isn't a tty here).
          python3 -u -m http.server 8123 > /tmp/py8123.log 2>&1 &
          SERVER_PID=$!

          # python takes a moment to actually bind — poll lsof instead of a
          # fixed sleep so this isn't flaky under CI load. Generous timeout
          # (30s) in case of first-run Gatekeeper scanning delays.
          for i in $(seq 1 60); do
            lsof -nP -iTCP:8123 -sTCP:LISTEN >/dev/null 2>&1 && break
            sleep 0.5
          done
          if ! lsof -nP -iTCP:8123 -sTCP:LISTEN; then
            echo "port 8123 never reached LISTEN state" >&2
            echo "--- python process alive? ---" >&2
            kill -0 "$SERVER_PID" 2>&1 && echo "yes (pid $SERVER_PID)" >&2 || echo "no — it exited" >&2
            echo "--- python output ---" >&2
            cat /tmp/py8123.log >&2
            echo "--- python3 --version ---" >&2
            python3 --version >&2
            which python3 >&2
            exit 1
          fi

          ./target/release/portmortem 8123
          ./target/release/portmortem 8123 --json | tee /tmp/out.json

          # Fail the job if the JSON doesn't actually report the listener
          grep -q '"port":8123' /tmp/out.json

          kill $SERVER_PID

      - name: Smoke test — --kill flag
        run: |
          python3 -u -m http.server 8124 &
          SERVER_PID=$!

          for i in $(seq 1 60); do
            lsof -nP -iTCP:8124 -sTCP:LISTEN >/dev/null 2>&1 && break
            sleep 0.5
          done
          lsof -nP -iTCP:8124 -sTCP:LISTEN || { echo "port 8124 never reached LISTEN state" >&2; exit 1; }

          ./target/release/portmortem 8124 --kill
          sleep 1

          # Process should be gone now
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "process still alive after --kill" >&2
            exit 1
          fi

      - name: --version / --help sanity check
        run: |
          ./target/release/portmortem --version
          ./target/release/portmortem --help
