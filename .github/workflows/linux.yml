name: Linux

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Run unit tests
        run: cargo test --release --verbose

      - name: Smoke test — free port
        run: |
          ./target/release/portmortem 65432
          ./target/release/portmortem 65432 --json

      - name: Smoke test — occupied port (real /proc path)
        run: |
          python3 -m http.server 8123 &
          SERVER_PID=$!

          # python takes a moment to actually bind — poll ss instead of a
          # fixed sleep so this isn't flaky under CI load.
          for i in $(seq 1 20); do
            ss -ltn | grep -q ":8123 " && break
            sleep 0.5
          done
          ss -ltn | grep -q ":8123 " || { echo "port 8123 never reached LISTEN state" >&2; exit 1; }

          ./target/release/portmortem 8123
          ./target/release/portmortem 8123 --json | tee /tmp/out.json

          # Fail the job if the JSON doesn't actually report the listener
          grep -q '"port":8123' /tmp/out.json

          kill $SERVER_PID

      - name: Smoke test — --kill flag
        run: |
          python3 -m http.server 8124 &
          SERVER_PID=$!

          for i in $(seq 1 20); do
            ss -ltn | grep -q ":8124 " && break
            sleep 0.5
          done
          ss -ltn | grep -q ":8124 " || { echo "port 8124 never reached LISTEN state" >&2; exit 1; }

          ./target/release/portmortem 8124 --kill
          sleep 1

          # Process should be gone now
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo "process still alive after --kill" >&2
            exit 1
          fi

      - name: --version / --help sanity check
        run: |
          ./target/release/portmortem --version
          ./target/release/portmortem --help
